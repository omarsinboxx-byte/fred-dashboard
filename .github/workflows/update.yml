name: Update FRED data

on:
  schedule:
    # 12:00 UTC, Mon-Fri (~7-8am US Eastern depending on DST) — after most
    # daily/weekly FRED series post their overnight update.
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "Update FRED data ($(date -u +%Y-%m-%d))"
            git push
          fi

